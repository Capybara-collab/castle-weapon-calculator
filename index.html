<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071429">
  <meta name="description" content="水豚製作的守城聯機實用工具網站。">
  <title>守城聯機工具站｜水豚</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      color: #f7f3ea;
      background:
        radial-gradient(ellipse at top, rgba(36, 97, 187, .25), transparent 48%),
        linear-gradient(180deg, #071429, #030917);
    }

    .container {
      width: min(700px, calc(100% - 30px));
      margin: auto;
      padding: 65px 0 35px;
    }

    header {
      text-align: center;
      margin-bottom: 38px;
    }

    h1 {
      color: #f3cf85;
      font-size: clamp(2rem, 6vw, 3rem);
      margin: 0;
      font-weight: 900;
    }

    header p {
      color: #a7b6ce;
      margin-top: 12px;
    }

    .badge {
      display: inline-block;
      margin-top: 12px;
      padding: 8px 18px;
      border: 1px solid rgba(243, 207, 133, .2);
      border-radius: 999px;
      color: #e9dcc0;
      background: rgba(243, 207, 133, .06);
      font-size: .9rem;
    }

    .menu {
      display: grid;
      gap: 18px;
    }

    .menu a {
      display: block;
      padding: 25px 22px;
      border: 1px solid rgba(243, 207, 133, .18);
      border-radius: 20px;
      color: #f7f3ea;
      background: linear-gradient(145deg, #122342, #08142a);
      box-shadow: 0 15px 35px rgba(0, 0, 0, .25);
      text-decoration: none;
      transition: .2s;
    }

    .menu a:hover {
      transform: translateY(-4px);
      border-color: #f3cf85;
      background: linear-gradient(145deg, #1b345b, #101d36);
    }

    .menu h2 {
      margin: 0 0 8px;
      color: #f3cf85;
      font-size: 1.35rem;
    }

    .menu p {
      margin: 0;
      color: #a7b6ce;
      font-size: .92rem;
    }

    .arrow {
      float: right;
      color: #f3cf85;
      font-size: 1.4rem;
    }

    footer {
      margin-top: 45px;
      text-align: center;
      color: #a7b6ce;
      font-size: .85rem;
    }

    .youtube {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 17px;
      border-radius: 12px;
      color: #ffd9df;
      background: rgba(110, 24, 35, .6);
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main class="container">

    <header>
      <h1>守城聯機工具站</h1>
      <p>水豚製作・提供玩家方便實用的小工具</p>
      <span class="badge">Designed & Developed by 水豚</span>
    </header>

    <nav class="menu">

      <a href="weapon.html">
        <span class="arrow">➜</span>
        <h2>⚔️ 專武強化計算器</h2>
        <p>計算專武升級材料、最佳材料分配與升級路線。</p>
      </a>

      <a href="talent.html">
        <span class="arrow">➜</span>
        <h2>🌟 天賦模擬器</h2>
        <p>自由配置天賦，計算所需能量點數。</p>
      </a>

      <a href="support.html">
        <span class="arrow">➜</span>
        <h2>❤️ 水豚補給站</h2>
        <p>感謝每一位支持網站製作與更新的玩家。</p>
      </a>

    </nav>

    <footer>
      <p>感謝巧克力果醬和飛天小女警贊助播出</p>
      <p>© 2026 水豚 · All Rights Reserved.</p>
      <a class="youtube"
         href="https://www.youtube.com/@Capybara_2007-CDO"
         target="_blank"
         rel="noopener noreferrer">
        水豚的 YouTube 頻道
      </a>
    </footer>

  </main>
</body>
</html>
